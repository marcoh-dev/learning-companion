{% extends "base.html" %}

{% block title %}Goals · Learning Companion{% endblock %}

{% block content %}
  <h1>Your goals</h1>
  <ul class="goal-list">
    {% for goal in goal_list %}
      <li><strong>{{ goal.title }}</strong> <mark>{{ goal.get_status_display }}</mark></li>
    {% endfor %}
  </ul>
{% endblock %}
