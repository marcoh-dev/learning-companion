{% extends "base.html" %}

{% block title %}Delete goal · Learning Companion{% endblock %}

{% block content %}
  <h1>Delete “{{ goal.title }}”?</h1>
  <p>This removes the goal permanently.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit">Delete</button>
    <a href="{% url 'goal-detail' goal.pk %}">Cancel</a>
  </form>
{% endblock %}
