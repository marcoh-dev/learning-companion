# CI: runs the Django system checks and test suite.
# The job name `test` is a required status check on main and develop.
name: ci

on:
  push:
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Not a secret: settings refuse to start without a key when DEBUG is off.
      SECRET_KEY: ci-only-not-a-secret
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Django system checks
        run: python src/manage.py check
      - name: Run the test suite
        run: python src/manage.py test src -t src
